PACKAGE_NAME="hp-wmi-fan-and-backlight-control"
PACKAGE_VERSION="0.0.2"

# Build out-of-tree with the SAME compiler the target kernel was built with.
# Clang-built kernels (CachyOS, some hardened/LTO distros) reject gcc for
# external modules, so pass LLVM=1 when the kernel config says CC_IS_CLANG.
# $kernel_source_dir is provided by DKMS for the kernel being built against;
# it is empty during metadata-only ops (add/status), where this safely no-ops.
_hpwmi_kconfig=""
for _c in "$kernel_source_dir/.config" "$kernel_source_dir/include/config/auto.conf"; do
    if [ -r "$_c" ]; then _hpwmi_kconfig="$_c"; break; fi
done
_hpwmi_llvm=""
if [ -n "$_hpwmi_kconfig" ] && grep -q '^CONFIG_CC_IS_CLANG=y' "$_hpwmi_kconfig"; then
    _hpwmi_llvm="LLVM=1"
fi

MAKE[0]="make -C $kernel_source_dir M=$dkms_tree/$module/$module_version/build/ $_hpwmi_llvm EXTRA_CFLAGS='' modules"
CLEAN=true
BUILT_MODULE_NAME[0]="hp-wmi"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86/hp"
AUTOINSTALL="yes"
